<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>My Calculator</title> <link rel="stylesheet" href="style.css"> </head> <body>

<main class="calculator" id="calculator"> <h1>Calculator</h1>

<div class="screen">
    <div id="previous"></div>
    <div id="display">0</div>
</div>

<div class="buttons">
    <button class="utility" data-action="clear">AC</button>
    <button class="utility" data-action="sign">±</button>
    <button class="utility" data-action="percent">%</button>
    <button class="operator" data-action="operator" data-value="÷">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-action="operator" data-value="×">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-action="operator" data-value="−">−</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-action="operator" data-value="+">+</button>

    <button class="utility" data-action="delete">⌫</button>
    <button data-value="0">0</button>
    <button data-value=".">.</button>
    <button class="equals" data-action="equals">=</button>
</div>


</main>

<main class="game-center" id="game-center" hidden> <h1>Game Center</h1>

<div class="game-card">
    <h2>Pac-Man</h2>

    <iframe
        src="https://freepacman.org/"
        title="Pac-Man"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen>
    </iframe>
</div>

<button class="back-button" id="back-button">
    ← Back to Calculator
</button>


</main>

<script src="script.js"></script>

</body> </html>
